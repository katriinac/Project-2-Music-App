    env:
      MY_API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout koodi
        uses: actions/checkout@v4

      - name: Asenna riippuvuudet
        run: npm install

      - name: Aja testit avaimella
        run: npm run test
