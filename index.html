<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Otsikko </h1>
        <p>tekstiä</p>
    </header>
    
    <section id="search">
        <h2>otsikko</h2>
        <input type="text" name="inputArtist" id="inputArtist" placeholder="Search for an artist">
        <button id="searchButton">Search</button>
    </section>

    <section id="artists">
        <div id="artistList">
            <h2>Featured artists:</h2>
            <ul>
                <li><a href="" class="singerLink">Taylor Swift </a></li>
                <li><a href="" class="singerLink">Beyonce</a></li>
                <li><a href="" class="singerLink">Selena Gomez</a></li>
                <li><a href="" class="singerLink">Pitbull</a></li>
                <li><a href="" class="singerLink">Ed Sheeran</a></li>
                <li><a href="" class="singerLink">David Guetta</a></li>
            </ul>
        </div>
    </section>

    <section id="artistInfo">
        <p>The artist will display here</p>
    </section>

    <section id="albums">
        <h2>Albumit</h2>
        <div id="albumList">
            <!--albumit tänne-->
        </div>
    </section>

    <section id="songSection">
        <h2 id="albumName">Songs</h2>
        <div id="songList">
            <!--musiikki tänne-->
        </div>
    </section>
</body>
</html>
