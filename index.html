<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Music App </h1>
        <p>Find artists information and most popular album</p>
    </header>
    <div id="splitsec">
        <section id="search">
            <h2>Search for an artist</h2>
            <input type="text" name="inputArtist" id="inputArtist" placeholder="Search for an artist">
            <button id="searchButton">Search</button>
        </section>

        <section id="artists">
            <div id="artistList">
                <h2>Featured artists:</h2>
                <ul id="singers">
                    <li><a href="" class="singerLink">Taylor Swift </a></li>
                    <li><a href="" class="singerLink">Beyonce</a></li>
                    <li><a href="" class="singerLink">BTS</a></li>
                    <li><a href="" class="singerLink">BlackPink</a></li>
                    <li><a href="" class="singerLink">Ariana grande</a></li>
                    <li><a href="" class="singerLink">Lady Gaga</a></li>
                </ul>
            </div>
        </section>
    </div>
    <div id="splitsection">
        <section id="artistInfo">
            <h2>Artist</h2>
            <div id="artistBio">
                <p>The artist will display here</p>
                <!--artist info here-->
            </div>
        </section>

        <section id="albums">
            <h2>Top Album</h2>
            <div id="albumList">
                <!--album here-->
            </div>
        </section>

        <section id="songSection">
            <h2 id="albumName">Songs</h2>
            <div id="songList">
                <!--songs here-->
            </div>
        </section>
    </div>
</body>
</html>
