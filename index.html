<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Otsikko </h1>
        <p>tekstiä</p>
    </header>
    
    <section id="search">
        <h2>otsikko</h2>
        <input type="text" name="inputArtist" id="inputArtist" placeholder="Search for an artist">
        <button id="searchButton">Search</button>
    </section>

    <section id="artists">
        <h2>otsikko</h2>
        <div id="artistList">
            <!--artistit tänne-->
        </div>
    </section>

    <section id="artistInfo">
        <h2 id="artistName">Name</h2>
        <img id="artistImage" alt="Picture of the artist" src="">
        <p id="artistDesc">desc artistista</p>
    </section>

    <section id="albums">
        <h2>Albumit</h2>
        <div id="albumList">
            <!--albumit tänne-->
        </div>
    </section>

    <section id="songSection">
        <h2 id="albumName">Songs</h2>
        <div id="songList">
            <!--musiikki tänne-->
        </div>
    </section>
</body>
</html>
